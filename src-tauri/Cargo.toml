[package]
name = "zemzeme"
version = "0.1.0"
description = "Speech to text at your cursor"
authors = ["Mohammad Hadi Rezaei"]
license = "MIT"
repository = "https://github.com/mhrezaei/Zemzeme"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zemzeme_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
cpal = "0.18.2"
hound = "3.5.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
base64 = "0.23.1"
dotenvy = "0.15.7"
arboard = "3.7.0"
keyring = "4.2.0"
dirs = "7.0.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
